<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パンヒーローラン</title>

  <!-- Pixel 9 横画面最適化 -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
  <div id="score">SCORE: 0</div>

  <div id="player">
    <div class="nose"></div>
    <div class="cheek left"></div>
    <div class="cheek right"></div>
  </div>

  <div id="ground"></div>

  <div id="gameOver">
    <div class="panel">
      <p>GAME OVER</p>
      <button id="restartBtn">RESTART</button>

      <div class="speed">
        SPEED
        <input type="range" min="3" max="12" value="6" id="speedControl">
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
