<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パンヒーロー パン集め</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
  <div id="info">パン: <span id="count">0</span> / 5</div>

  <div id="player">
    <div class="nose"></div>
  </div>

  <div id="enemy"></div>

  <!-- パン -->
  <div class="bread" style="top:120px; left:40px"></div>
  <div class="bread" style="top:220px; left:200px"></div>
  <div class="bread" style="top:320px; left:80px"></div>
  <div class="bread" style="top:420px; left:220px"></div>
  <div class="bread" style="top:520px; left:120px"></div>

  <!-- 十字キー -->
  <div id="pad">
    <button data-dir="up">▲</button>
    <div>
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
    </div>
    <button data-dir="down">▼</button>
  </div>

  <div id="message"></div>
</div>

<script src="script.js"></script>
</body>
</html>
