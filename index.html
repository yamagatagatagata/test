<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パンヒーローラン</title>

  <meta name="viewport"
        content="width=device-width,
                 height=device-height,
                 initial-scale=1.0,
                 user-scalable=no">

  <!-- 縦画面推奨 -->
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
  <div id="score">SCORE: 0</div>

  <div id="player">
    <div class="nose"></div>
    <div class="cheek left"></div>
    <div class="cheek right"></div>
  </div>

  <div id="ground"></div>

  <!-- スピード調整（常時表示） -->
  <div id="speedUI">
    SPEED
    <input type="range" min="1" max="20" value="6" id="speedControl">
    <span id="speedValue">6</span>
  </div>

  <div id="gameOver">
    <div class="panel">
      <p>GAME OVER</p>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
